<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus · Software con foco en diseño, AI y productividad</title>
    <meta
      name="description"
      content="Diseñamos y construimos producto digital pensado desde la experiencia de quien lo usa: interfaces claras, integraciones con AI que ahorran pasos reales y flujos de trabajo sin fricción."

    <meta name="theme-color" content="#5d12d2" />

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado antes del primer paint para evitar el flash.
      try {
        const t = localStorage.getItem('nexus-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>

    <div id="root"></div>
