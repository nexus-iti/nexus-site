# app.nexus.wefaber.net: el producto (gravida), mismo stack que hoy está en
# nexus.wefaber.net. Detrás de Cloudflare Access.
#
# Es el server block actual de nexus.wefaber.net con otro server_name. Copiá el bloque
# actual tal cual (proxy, headers, timeouts, TLS) y cambiá solo:
#   - server_name -> app.nexus.wefaber.net
#   - el certificado, si el actual no cubre *.nexus.wefaber.net
#     (un cert de nexus.wefaber.net NO cubre app.nexus.wefaber.net).
#
# Referencia mínima si hubiera que rearmarlo:

server {
    server_name app.nexus.wefaber.net;
    # listen 443 ssl; http2 on;
    # ssl_certificate     ...;
    # ssl_certificate_key ...;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        # gravida compara Origin contra Host (CSRF): el Host tiene que pasar tal cual.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
