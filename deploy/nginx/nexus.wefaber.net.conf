# nexus.wefaber.net: sitio estático (este repo). Público, sin Cloudflare Access.
# Reemplaza al server block actual de nexus.wefaber.net (que hoy hace proxy al producto).
#
# TLS: copiá las líneas ssl_* / listen 443 del bloque actual de nexus.wefaber.net,
# no cambian con la mudanza.

server {
    server_name nexus.wefaber.net;
    # listen 443 ssl; http2 on;            <- del bloque actual
    # ssl_certificate     ...;              <- del bloque actual
    # ssl_certificate_key ...;              <- del bloque actual

    root /srv/nexus-site/current;
    index index.html;

    # Links viejos del producto (marcadores, QR, docs): mandarlos a la app.
    location ~ ^/(login\.php|pages/|api/|js/|css/|images/|uploads/|.*\.php$) {
        return 301 https://app.nexus.wefaber.net$request_uri;
    }

    # Assets de Vite con hash en el nombre: cache largo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
